# 개발용 Docker Compose: db(PostGIS) · engine · backend · frontend(vite dev)
#
#   cp .env.example .env            # 키는 나중에 채워도 된다 (샘플 그래프로 바로 동작)
#   docker compose up --build       # http://localhost:5173  (관리자 /admin, API /api)
#
# 코드 폴더를 컨테이너에 마운트하고 --reload / vite dev 로 띄우므로 수정이 바로 반영된다.
# 부산 실데이터 적재:  docker compose --profile pipeline run --rm pipeline  (data/raw/south-korea-latest.osm.pbf 필요)
# 그 뒤  docker compose restart engine  (GRAPH_SOURCE=auto 가 PostGIS 그래프를 찾아 자동으로 쓴다)

name: pathfinder

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
      POSTGRES_USER: ${POSTGRES_USER:-pathfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathfinder_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathfinder} -d ${POSTGRES_DB:-pathfinder}"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      GRAPH_SOURCE: ${GRAPH_SOURCE:-auto}
      GRAPH_BUNDLE_PATH: /app/data/samples/grid_city.npz
      BUILDINGS_PATH: /app/data/samples/grid_city_buildings.json
      GRAPH_BUILD_DIR: /app/data/build
      DATABASE_URL: postgresql://${POSTGRES_USER:-pathfinder}:${POSTGRES_PASSWORD:-pathfinder_dev}@db:5432/${POSTGRES_DB:-pathfinder}
      ENGINE_TIME_BUDGET_S: ${ENGINE_TIME_BUDGET_S:-2.5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./engine/app:/app/app
      - ./data/samples:/app/data/samples
      - ./data/build:/app/data/build:ro
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pathfinder}:${POSTGRES_PASSWORD:-pathfinder_dev}@db:5432/${POSTGRES_DB:-pathfinder}
      ENGINE_URL: http://engine:8001
      ENGINE_TIMEOUT_S: ${ENGINE_TIMEOUT_S:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATA_DIR: /app/data
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-true}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_ENABLED: ${ALERT_ENABLED:-true}
      PERSONALIZATION_ENABLED: ${PERSONALIZATION_ENABLED:-true}
      PERSONALIZATION_EPSILON: ${PERSONALIZATION_EPSILON:-0.1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      ACCESS_LOG_ENABLED: ${ACCESS_LOG_ENABLED:-true}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
    volumes:
      - ./backend/app:/app/app
      - ./data/subway:/app/data/subway:ro
      - ./data/bus:/app/data/bus:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_VWORLD_KEY: ${VITE_VWORLD_KEY:-}
      VITE_BASEMAP_STYLE_URL: ${VITE_BASEMAP_STYLE_URL:-}
      PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # 부산 실데이터 빌드 (필요할 때만):  docker compose --profile pipeline run --rm pipeline
  pipeline:
    build:
      context: .
      dockerfile: engine/Dockerfile
      target: pipeline
    profiles: ["pipeline"]
    working_dir: /app
    environment:
      BUS_SERVICE_KEY: ${BUS_SERVICE_KEY:-}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
    volumes:
      - ./engine/app:/app/app
      - ./data:/app/data
    command: >
      sh -c "python -m app.pipeline.run_all --pbf /app/data/raw/south-korea-latest.osm.pbf
             --boundary /app/data/boundary/busan_hangjeongdong.geojson
             --unramped /app/data/osm/busan_osm_steps_ramp_no_20260724.geojson
             --dem /app/data/dem/busan_dem_clipped_90m.tif
             --out /app/data/build
             $${BIMS_ARGS:---bims-cache /app/data/build/bims}
             --postgis postgresql://${POSTGRES_USER:-pathfinder}:${POSTGRES_PASSWORD:-pathfinder_dev}@db:5432/${POSTGRES_DB:-pathfinder}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
