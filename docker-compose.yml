services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
      POSTGRES_USER: ${POSTGRES_USER:-pathfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathfinder_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pathfinder-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathfinder} -d ${POSTGRES_DB:-pathfinder}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pathfinder-network

  ai:
    build: ./ai
    ports:
      - "8001:8001"
    env_file:
      - .env
      - ai/.env
    networks:
      - pathfinder-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    depends_on:
      - backend
    networks:
      - pathfinder-network

networks:
  pathfinder-network:
    driver: bridge

volumes:
  postgres_data:
