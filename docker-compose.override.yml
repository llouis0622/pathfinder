# 로컬 개발용 볼륨 마운트 (핫리로드)
services:
  backend:
    volumes:
      - ./backend/app:/app/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1

  ai:
    volumes:
      - ./ai/app:/app/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
